<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>
    Dashboard | Asbestos Analysis Manager
  </title>

  <link
    rel="stylesheet"
    href="css/style.css"
  >
</head>

<body>

  <div class="app-container">

    <aside class="sidebar">

      <div class="sidebar-logo">
        <h1>Asbestos</h1>
        <p>Analysis Manager</p>
      </div>

      <nav class="sidebar-nav">

        <a
          href="index.html"
          class="nav-item active"
        >
          Dashboard
        </a>

        <a
          href="projects.html"
          class="nav-item"
        >
          案件一覧
        </a>

        <a
          href="register.html"
          class="nav-item"
        >
          新規案件登録
        </a>

      </nav>

    </aside>

    <main class="main-content">

      <div class="page-header">

        <div>
          <p class="page-subtitle">
            DASHBOARD
          </p>

          <h2>Dashboard</h2>
        </div>

      </div>

      <section class="dashboard-grid">

        <article class="dashboard-card">

          <p class="dashboard-card-label">
            総案件数
          </p>

          <p
            class="dashboard-card-value"
            id="totalProjects"
          >
            0
          </p>

          <p class="dashboard-card-unit">
            件
          </p>

        </article>

        <article class="dashboard-card">

          <p class="dashboard-card-label">
            総試料数
          </p>

          <p
            class="dashboard-card-value"
            id="totalSamples"
          >
            0
          </p>

          <p class="dashboard-card-unit">
            件
          </p>

        </article>

        <article class="dashboard-card">

          <p class="dashboard-card-label">
            今月の受付案件
          </p>

          <p
            class="dashboard-card-value"
            id="monthlyProjects"
          >
            0
          </p>

          <p class="dashboard-card-unit">
            件
          </p>

        </article>

      </section>

      <section class="form-card dashboard-guide">

        <div class="section-title">
          <h3>Quick Actions</h3>
          <p>
            案件の確認や新規登録へ移動できます。
          </p>
        </div>

        <div class="dashboard-actions">

          <a
            href="projects.html"
            class="dashboard-action-link"
          >
            案件一覧を見る
          </a>

          <a
            href="register.html"
            class="dashboard-action-link dashboard-action-primary"
          >
            新規案件を登録
          </a>

        </div>

      </section>

    </main>

  </div>

  <script src="js/dashboard.js"></script>

</body>
</html>
